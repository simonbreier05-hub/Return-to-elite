version: "3.8"

# Postgres for the housekeeping system.
# Usage:
#   docker compose up -d
#   export DATABASE_URL="postgresql://stayclean:stayclean@localhost:5432/stayclean?schema=public"
#   npm run db:push:postgres && npm run db:generate:postgres && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: stayclean-postgres
    environment:
      POSTGRES_USER: stayclean
      POSTGRES_PASSWORD: stayclean
      POSTGRES_DB: stayclean
    ports:
      - "5432:5432"
    volumes:
      - stayclean_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayclean -d stayclean"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stayclean_pgdata:
