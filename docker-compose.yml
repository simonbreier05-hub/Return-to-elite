version: "3.8"

# Postgres for the housekeeping system.
# Usage:
#   docker compose up -d
#   export DATABASE_URL="postgresql://elite:elite@localhost:5432/elite_hk?schema=public"
#   npm run db:push:postgres && npm run db:generate:postgres && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: elite-hk-postgres
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
      POSTGRES_DB: elite_hk
    ports:
      - "5432:5432"
    volumes:
      - elite_hk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite_hk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elite_hk_pgdata:
